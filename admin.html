<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juegos Fatima - Panel de Administración</title>
  <style>
    :root {
      --bg-main: #0a0e17;
      --bg-card: #131c2e;
      --border: rgba(255, 255, 255, 0.1);
      --accent: #00f2fe;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #06d6a0;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
    }

    body {
      background: var(--bg-main);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 14px;
      gap: 10px;
    }

    h1 {
      font-size: 1.4rem;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-links {
      display: flex;
      gap: 8px;
    }

    .back-btn {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.8rem;
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .back-btn:hover {
      color: #fff;
      border-color: var(--accent);
      background: rgba(0, 242, 254, 0.1);
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .card-title {
      font-size: 1.1rem;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .auth-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      padding: 30px 10px;
      text-align: center;
    }

    input[type="password"], input[type="text"] {
      background: #0f172a;
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 1rem;
      width: 100%;
      max-width: 300px;
      outline: none;
      text-align: center;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
    }

    .btn {
      padding: 9px 16px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--accent);
      color: #070a12;
    }

    .btn-primary:hover {
      filter: brightness(1.1);
    }

    .btn-danger {
      background: var(--danger);
      color: #fff;
    }

    .btn-danger:hover {
      background: var(--danger-hover);
    }

    .btn-secondary {
      background: #1e293b;
      color: #fff;
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: #334155;
    }

    /* TABS */
    .game-tabs {
      display: flex;
      gap: 6px;
      background: #0d1424;
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .game-tab-btn {
      flex: 1;
      padding: 8px 12px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .game-tab-btn.active {
      background: var(--accent);
      color: #080c14;
    }

    .stats-summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat-box {
      background: #0d1424;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stat-val {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent);
    }

    .stat-lbl {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-top: 2px;
    }

    .actions-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    pre {
      background: #090d16;
      padding: 12px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 0.8rem;
      max-height: 200px;
      overflow-y: auto;
      color: #7dd3fc;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .hidden {
      display: none !important;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      background: #1e293b;
      color: #fff;
      padding: 10px 18px;
      border-radius: 20px;
      border: 1px solid var(--accent);
      font-size: 0.85rem;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>⚙️ Panel de Administración</h1>
      <div class="header-links">
        <a href="index.html" class="back-btn">💡 Lights Out</a>
        <a href="flow.html" class="back-btn">🌊 Flow</a>
      </div>
    </header>

    <!-- PANTALLA DE ACCESO CON CLAVE -->
    <div class="card auth-section" id="auth-panel">
      <div style="font-size: 2.5rem;">🔒</div>
      <h2>Acceso Protegido</h2>
      <p style="color: var(--text-muted); font-size: 0.85rem;">
        Ingresa la clave de administrador para gestionar las tablas de puntajes.<br>
        (Clave por defecto: <strong>1234</strong>)
      </p>
      <input type="password" id="admin-pass" placeholder="Ingresa la clave" autofocus>
      <button class="btn btn-primary" onclick="verifyPassword()">Ingresar al Panel</button>
    </div>

    <!-- PANEL PRINCIPAL -->
    <div id="main-panel" class="hidden" style="display: flex; flex-direction: column; gap: 18px;">
      
      <!-- Pestañas de Juegos -->
      <div class="game-tabs">
        <button class="game-tab-btn active" id="tab-lightsout" onclick="switchGameTab('lightsout')">💡 Lights Out</button>
        <button class="game-tab-btn" id="tab-flow" onclick="switchGameTab('flow')">🌊 Flow Free</button>
      </div>

      <!-- Resumen del Juego Seleccionado -->
      <div class="card">
        <h2 class="card-title" id="summary-title">📊 Resumen de Puntajes</h2>
        <div class="stats-summary" id="stats-container"></div>

        <div class="actions-grid">
          <button class="btn btn-danger" onclick="clearSelectedGameScores()">
            🗑️ Vaciar Puntajes de este Juego
          </button>
          <button class="btn btn-secondary" onclick="downloadJSON()">
            📥 Descargar Backup JSON
          </button>
          <label class="btn btn-secondary" style="cursor: pointer;">
            📤 Restaurar JSON
            <input type="file" id="file-input" accept=".json" style="display: none;" onchange="importJSON(event)">
          </label>
        </div>
      </div>

      <!-- Visor de JSON -->
      <div class="card">
        <h2 class="card-title">📄 Archivo JSON en Memoria (<span id="json-label">lightsout</span>)</h2>
        <pre id="json-viewer">[]</pre>
      </div>

      <!-- Configuración de Clave -->
      <div class="card">
        <h2 class="card-title">🔑 Cambiar Clave de Administrador</h2>
        <div style="display: flex; gap: 8px; max-width: 400px;">
          <input type="password" id="new-pass" placeholder="Nueva clave" style="text-align: left;">
          <button class="btn btn-secondary" onclick="changeAdminPassword()">Actualizar</button>
        </div>
      </div>

    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const STORAGE_KEYS = {
      lightsout: 'lightsout_scores_json',
      flow: 'flow_scores_json'
    };
    const PIN_KEY = 'lightsout_admin_pin';
    const DEFAULT_PIN = '1234';

    let activeGame = 'lightsout';

    function getAdminPin() {
      return localStorage.getItem(PIN_KEY) || DEFAULT_PIN;
    }

    function verifyPassword() {
      const entered = document.getElementById('admin-pass').value;
      if (entered === getAdminPin()) {
        document.getElementById('auth-panel').classList.add('hidden');
        document.getElementById('main-panel').classList.remove('hidden');
        loadData();
        showToast("Acceso concedido");
      } else {
        showToast("Clave incorrecta");
      }
    }

    document.getElementById('admin-pass').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') verifyPassword();
    });

    function switchGameTab(game) {
      activeGame = game;
      document.getElementById('tab-lightsout').classList.toggle('active', game === 'lightsout');
      document.getElementById('tab-flow').classList.toggle('active', game === 'flow');
      loadData();
    }

    function loadData() {
      const key = STORAGE_KEYS[activeGame];
      let scores = [];
      try {
        const raw = localStorage.getItem(key);
        scores = raw ? JSON.parse(raw) : [];
      } catch (e) { scores = []; }

      const title = document.getElementById('summary-title');
      const stats = document.getElementById('stats-container');
      const jsonViewer = document.getElementById('json-viewer');
      document.getElementById('json-label').textContent = key;

      if (activeGame === 'lightsout') {
        title.innerHTML = '📊 Resumen: Lights Out';
        stats.innerHTML = `
          <div class="stat-box"><div class="stat-val">${scores.length}</div><div class="stat-lbl">Partidas</div></div>
          <div class="stat-box"><div class="stat-val">${scores.filter(s => s.mode === '1x5').length}</div><div class="stat-lbl">1x5</div></div>
          <div class="stat-box"><div class="stat-val">${scores.filter(s => s.mode === '3x3').length}</div><div class="stat-lbl">3x3</div></div>
          <div class="stat-box"><div class="stat-val">${scores.filter(s => s.mode === '5x5').length}</div><div class="stat-lbl">5x5</div></div>
        `;
      } else {
        title.innerHTML = '📊 Resumen: Flow Free';
        stats.innerHTML = `
          <div class="stat-box"><div class="stat-val">${scores.length}</div><div class="stat-lbl">Partidas</div></div>
          <div class="stat-box"><div class="stat-val">${scores.filter(s => s.size === '5x5').length}</div><div class="stat-lbl">5x5</div></div>
          <div class="stat-box"><div class="stat-val">${scores.filter(s => s.size === '6x6').length}</div><div class="stat-lbl">6x6</div></div>
          <div class="stat-box"><div class="stat-val">${scores.filter(s => s.size === '7x7').length}</div><div class="stat-lbl">7x7</div></div>
          <div class="stat-box"><div class="stat-val">${scores.filter(s => s.size === '8x8').length}</div><div class="stat-lbl">8x8</div></div>
        `;
      }

      jsonViewer.textContent = JSON.stringify(scores, null, 2);
    }

    function clearSelectedGameScores() {
      const name = activeGame === 'lightsout' ? 'Lights Out' : 'Flow Free';
      if (confirm(`⚠️ ¿Deseas vaciar TODOS los puntajes de ${name}?`)) {
        localStorage.removeItem(STORAGE_KEYS[activeGame]);
        if (activeGame === 'lightsout') {
          ['1x5', '3x3', '5x5'].forEach(m => localStorage.removeItem(`lightsout_best_${m}`));
        }
        loadData();
        showToast(`¡Puntajes de ${name} eliminados!`);
      }
    }

    function downloadJSON() {
      const key = STORAGE_KEYS[activeGame];
      const raw = localStorage.getItem(key) || '[]';
      const blob = new Blob([raw], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${activeGame}_scores_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast("Descarga iniciada");
    }

    function importJSON(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const parsed = JSON.parse(event.target.result);
          if (Array.isArray(parsed)) {
            localStorage.setItem(STORAGE_KEYS[activeGame], JSON.stringify(parsed));
            loadData();
            showToast("Puntajes restaurados correctamente");
          } else {
            alert("El archivo JSON debe contener un arreglo de datos.");
          }
        } catch (err) {
          alert("Error: Archivo JSON no válido.");
        }
      };
      reader.readAsText(file);
    }

    function changeAdminPassword() {
      const newPass = document.getElementById('new-pass').value.trim();
      if (newPass.length < 3) {
        alert("La clave debe tener al menos 3 caracteres.");
        return;
      }
      localStorage.setItem(PIN_KEY, newPass);
      document.getElementById('new-pass').value = '';
      showToast("Clave actualizada correctamente");
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }
  </script>
</body>
</html>
